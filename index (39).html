<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Old Man Gus — Grumpiest Chatbot on the Internet</title>
<style>
  :root {
    --cream: #F4F1EA;
    --cream-deep: #EAE5D9;
    --ink: #2B2621;
    --ink-soft: #5B5346;
    --terracotta: #D97757;
    --terracotta-deep: #B85C3E;
    --line: #DDD5C4;
    --bubble-user: #2B2621;
    --bubble-user-text: #F4F1EA;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 20px 16px;
    text-align: center;
    border-bottom: 1px solid var(--line);
    background: var(--cream);
    position: relative;
  }

  header h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 12px;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  header h1 span {
    color: var(--terracotta-deep);
  }

  header p {
    margin: 10px 0 0;
    font-size: 13.5px;
    color: var(--ink-soft);
  }

  .mode-picker-wrap {
    position: relative;
    display: inline-block;
  }

  .mode-picker {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s ease;
  }

  .mode-picker:hover { border-color: var(--terracotta); }

  .mode-picker svg {
    transition: transform 0.15s ease;
    color: var(--ink-soft);
  }

  .mode-picker-wrap.open .mode-picker svg { transform: rotate(180deg); }

  .mode-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 6px;
    width: 260px;
    box-shadow: 0 8px 24px rgba(43, 38, 33, 0.12);
    z-index: 20;
    text-align: left;
  }

  .mode-picker-wrap.open .mode-dropdown { display: block; }

  .mode-option {
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 100%;
    background: none;
    border: none;
    padding: 9px 10px;
    border-radius: 9px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
  }

  .mode-option:hover { background: var(--cream-deep); }

  .mode-option.active { background: #FBEDE6; }

  .mode-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }

  .mode-desc {
    font-size: 12px;
    color: var(--ink-soft);
  }

  main {
    flex: 1;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 16px 140px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    display: flex;
    animation: rise 0.25s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { justify-content: flex-end; }
  .msg.bot { justify-content: flex-start; }

  .bubble {
    padding: 12px 16px;
    border-radius: 14px;
    max-width: 78%;
    line-height: 1.5;
    font-size: 15.5px;
  }

  .msg.bot .bubble {
    background: #fff;
    border: 1px solid var(--line);
    border-top-left-radius: 4px;
  }

  .msg.user .bubble {
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-top-right-radius: 4px;
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 4px 0;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-soft);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  form {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, var(--cream) 60%, transparent);
    padding: 24px 16px 20px;
  }

  .form-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 8px 8px 8px 16px;
    box-shadow: 0 4px 16px rgba(43, 38, 33, 0.06);
  }

  input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15.5px;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
  }

  input::placeholder { color: #A79E8C; }

  button {
    background: var(--terracotta);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover:not(:disabled) { background: var(--terracotta-deep); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .empty-state {
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    margin-top: 60px;
    padding: 0 30px;
  }
</style>
</head>
<body>

<header>
  <h1>Old Man <span>Gus</span></h1>
  <div class="mode-picker-wrap">
    <button id="modeButton" class="mode-picker" type="button">
      <span id="modeLabel">Gus — Grumpy</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div id="modeDropdown" class="mode-dropdown">
      <button class="mode-option" data-mode="gus">
        <span class="mode-name">Gus — Grumpy</span>
        <span class="mode-desc">Complains about everything. Just for laughs.</span>
      </button>
      <button class="mode-option" data-mode="serious">
        <span class="mode-name">Gus — Serious</span>
        <span class="mode-desc">Drops the act. Real answers, real help.</span>
      </button>
    </div>
  </div>
  <p>Complaints guaranteed. Ask him anything, he'll find something to grumble about.</p>
</header>

<main id="chat">
  <div class="empty-state" id="empty">
    Say "hi" if you dare. Gus doesn't like being bothered, but here he is anyway.
  </div>
</main>

<form id="form">
  <div class="form-inner">
    <input id="input" type="text" placeholder="Say something to annoy Gus..." autocomplete="off" autocorrect="off" spellcheck="false" inputmode="text" name="gus-message-field" />
    <button type="submit" id="send">Send</button>
  </div>
</form>

<script>
  const chat = document.getElementById("chat");
  const empty = document.getElementById("empty");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  let history = [];
  let currentMode = "gus";

  // Mode picker dropdown behavior
  const modeWrap = document.querySelector(".mode-picker-wrap");
  const modeButton = document.getElementById("modeButton");
  const modeLabel = document.getElementById("modeLabel");
  const modeOptions = document.querySelectorAll(".mode-option");

  modeButton.addEventListener("click", () => {
    modeWrap.classList.toggle("open");
  });

  document.addEventListener("click", (e) => {
    if (!modeWrap.contains(e.target)) modeWrap.classList.remove("open");
  });

  modeOptions.forEach((opt) => {
    opt.addEventListener("click", () => {
      currentMode = opt.dataset.mode;
      modeLabel.textContent = opt.querySelector(".mode-name").textContent;
      modeOptions.forEach((o) => o.classList.remove("active"));
      opt.classList.add("active");
      modeWrap.classList.remove("open");
      history = []; // start fresh when switching modes
      chat.innerHTML = '<div class="empty-state" id="empty">Switched. Say something.</div>';
    });
  });
  modeOptions[0].classList.add("active");

  function addMessage(role, text) {
    if (empty) empty.remove();
    const wrap = document.createElement("div");
    wrap.className = "msg " + (role === "user" ? "user" : "bot");
    wrap.innerHTML = `<div class="bubble">${text}</div>`;
    chat.appendChild(wrap);
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    return wrap.querySelector(".bubble");
  }

  function addTyping() {
    if (empty) empty.remove();
    const wrap = document.createElement("div");
    wrap.className = "msg bot";
    wrap.id = "typing-indicator";
    wrap.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chat.appendChild(wrap);
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }

  function removeTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage("user", text);
    history.push({ role: "user", content: text });
    input.value = "";
    sendBtn.disabled = true;
    addTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history, mode: currentMode }),
      });
      const data = await res.json();
      removeTyping();

      if (!res.ok) {
        addMessage("bot", "Ugh, something broke. Typical.");
      } else {
        addMessage("bot", data.reply);
        history.push({ role: "assistant", content: data.reply });
      }
    } catch (err) {
      removeTyping();
      addMessage("bot", "Can't even connect right. Newfangled internet.");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
