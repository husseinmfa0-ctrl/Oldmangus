<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Old Man Gus — Grumpiest Chatbot on the Internet</title>
<style>
  :root {
    --cream: #F4F1EA;
    --cream-deep: #EAE5D9;
    --ink: #2B2621;
    --ink-soft: #5B5346;
    --terracotta: #D97757;
    --terracotta-deep: #B85C3E;
    --line: #DDD5C4;
    --bubble-user: #2B2621;
    --bubble-user-text: #F4F1EA;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 20px 16px;
    text-align: center;
    border-bottom: 1px solid var(--line);
    background: var(--cream);
    position: relative;
  }

  header h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 12px;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  header h1 span {
    color: var(--terracotta-deep);
  }

  header p {
    margin: 10px 0 0;
    font-size: 13.5px;
    color: var(--ink-soft);
  }

  .weather-line {
    margin: 6px 0 0;
    font-size: 12px;
    color: var(--terracotta-deep);
    font-weight: 600;
  }

  .mode-picker-wrap {
    position: relative;
    display: inline-block;
  }

  .mode-picker {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s ease;
  }

  .mode-picker:hover { border-color: var(--terracotta); }

  .mode-picker svg {
    transition: transform 0.15s ease;
    color: var(--ink-soft);
  }

  .mode-picker-wrap.open .mode-picker svg { transform: rotate(180deg); }

  .mode-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 6px;
    width: 260px;
    box-shadow: 0 8px 24px rgba(43, 38, 33, 0.12);
    z-index: 20;
    text-align: left;
  }

  .mode-picker-wrap.open .mode-dropdown { display: block; }

  .mode-option {
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 100%;
    background: none;
    border: none;
    padding: 9px 10px;
    border-radius: 9px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
  }

  .mode-option:hover { background: var(--cream-deep); }

  .mode-option.active { background: #FBEDE6; }

  .mode-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }

  .mode-desc {
    font-size: 12px;
    color: var(--ink-soft);
  }

  /* Controls bar: Surprise Me + Grump-o-meter */
  .controls-bar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
  }

  .surprise-btn {
    background: #fff;
    border: 1px solid var(--terracotta);
    color: var(--terracotta-deep);
    border-radius: 20px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .surprise-btn:hover { background: #FBEDE6; }
  .surprise-btn:active { transform: scale(0.96); }

  .grump-meter {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .grump-label {
    font-size: 11.5px;
    color: var(--ink-soft);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .grump-track {
    display: flex;
    background: var(--cream-deep);
    border-radius: 12px;
    padding: 3px;
    gap: 2px;
  }

  .grump-option {
    background: none;
    border: none;
    padding: 5px 10px;
    border-radius: 9px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .grump-option.active {
    background: var(--terracotta);
    color: #fff;
  }

  /* Actions row under bot messages: share as image / whatsapp / X */
  .msg-actions {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    padding-left: 2px;
  }

  .action-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #fff;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    border-radius: 8px;
    padding: 4px 9px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .action-btn:hover {
    border-color: var(--terracotta);
    color: var(--terracotta-deep);
  }

  .action-btn svg { width: 13px; height: 13px; }

  .fav-btn.active { border-color: var(--terracotta); color: var(--terracotta-deep); }
  .fav-btn.active svg { fill: var(--terracotta); }

  /* Patience meter */
  .patience-wrap {
    max-width: 720px;
    width: 100%;
    margin: 12px auto 0;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .patience-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .patience-track {
    flex: 1;
    height: 6px;
    background: var(--cream-deep);
    border-radius: 4px;
    overflow: hidden;
  }

  .patience-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--terracotta), #C4432A);
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  .top-bar {
    position: sticky;
    top: 0;
    z-index: 12;
    background: var(--cream);
    border-bottom: 1px solid var(--line);
  }
  .challenge-banner {
    max-width: 720px;
    width: 100%;
    margin: 10px auto 0;
    padding: 0 20px;
  }

  .challenge-chip {
    display: block;
    width: 100%;
    background: #FBEDE6;
    border: 1px dashed var(--terracotta);
    border-radius: 12px;
    padding: 9px 14px;
    font-size: 12.5px;
    color: var(--terracotta-deep);
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
  }

  .challenge-chip:hover { background: #F6DFD3; }

  /* Quick reply chips (first-time helper) */
  .chips-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 18px;
    padding: 0 20px;
  }

  .chip-btn {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 7px 13px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .chip-btn:hover { border-color: var(--terracotta); color: var(--terracotta-deep); }

  .surprise-chip {
    background: #FBEDE6;
    border-color: var(--terracotta);
    color: var(--terracotta-deep);
  }

  /* Favorites panel */
  .favorites-overlay {
    position: fixed;
    inset: 0;
    background: rgba(43, 38, 33, 0.35);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 90;
  }

  .favorites-overlay.open { display: flex; }

  .favorites-panel {
    background: var(--cream);
    width: 100%;
    max-width: 720px;
    max-height: 70vh;
    border-radius: 20px 20px 0 0;
    padding: 18px 20px 24px;
    overflow-y: auto;
  }

  .favorites-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .favorites-header h2 {
    font-family: Georgia, serif;
    font-size: 19px;
    margin: 0;
  }

  .favorites-close {
    background: none;
    border: none;
    font-size: 20px;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 4px 8px;
  }

  .favorite-item {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .favorite-remove {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
    font-family: inherit;
  }

  .favorite-remove:hover { color: var(--terracotta-deep); }

  .favorites-empty {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13.5px;
    padding: 20px 0;
  }

  .favorites-toggle {
    position: fixed;
    top: 14px;
    right: 14px;
    width: 34px;
    height: 34px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 15;
  }

  .favorites-toggle svg { width: 16px; height: 16px; color: var(--ink-soft); }

  .badges-toggle {
    position: fixed;
    top: 14px;
    left: 14px;
    width: 34px;
    height: 34px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 50%;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 15;
  }

  .badges-toggle svg { width: 16px; height: 16px; color: var(--ink-soft); }

  .badge-item {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .badge-item.locked { opacity: 0.4; }

  .badge-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--terracotta);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .badge-item.locked .badge-icon { background: var(--ink-soft); }

  .badge-text strong { display: block; font-size: 13.5px; }
  .badge-text span { font-size: 12px; color: var(--ink-soft); }

  .badge-toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--cream);
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 50;
    pointer-events: none;
  }

  .badge-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Voice input mic button */
  .mic-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 0 6px;
    display: flex;
    align-items: center;
    transition: color 0.15s ease;
  }

  .mic-btn:hover { color: var(--terracotta-deep); }
  .mic-btn.recording { color: #C0392B; animation: micPulse 1s infinite ease-in-out; }
  .mic-btn svg { width: 20px; height: 20px; }

  @keyframes micPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  /* Instant reaction badge next to user message */
  .reaction-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid var(--line);
    margin-top: 4px;
    font-size: 11px;
  }

  main {
    flex: 1;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 16px 140px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    display: flex;
    animation: rise 0.25s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { justify-content: flex-end; }
  .msg.bot { justify-content: flex-start; }

  .msg-wrap {
    display: flex;
    flex-direction: column;
  }

  .msg-wrap.user { align-items: flex-end; }
  .msg-wrap.bot { align-items: flex-start; }

  .bubble {
    padding: 12px 16px;
    border-radius: 14px;
    max-width: 78%;
    line-height: 1.5;
    font-size: 15.5px;
  }

  .msg.bot .bubble {
    background: #fff;
    border: 1px solid var(--line);
    border-top-left-radius: 4px;
  }

  .msg.user .bubble {
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-top-right-radius: 4px;
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 4px 0;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-soft);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  form {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, var(--cream) 60%, transparent);
    padding: 24px 16px 20px;
  }

  .form-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 14px 10px 14px 22px;
    min-height: 60px;
    box-shadow: 0 4px 16px rgba(43, 38, 33, 0.06);
  }

  input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16.5px;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
  }

  input::placeholder { color: #A79E8C; }

  button {
    background: var(--terracotta);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover:not(:disabled) { background: var(--terracotta-deep); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #send {
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 50%;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  #send svg { width: 19px; height: 19px; }

  .empty-state {
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    margin-top: 60px;
    padding: 0 30px;
  }

  /* Gus character widget */
  .gus-character {
    position: fixed;
    bottom: 96px;
    left: 50%;
    transform: translateX(-50%) translateY(140px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
    z-index: 30;
  }

  .gus-character.visible {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .gus-character svg {
    filter: drop-shadow(0 6px 14px rgba(43, 38, 33, 0.18));
    background: #fff;
    border-radius: 50%;
    border: 3px solid var(--terracotta);
  }

  .gus-status-text {
    background: var(--ink);
    color: var(--cream);
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 10px;
    letter-spacing: 0.02em;
  }

  /* Thinking: eyes dart side to side, brows lift */
  .gus-character.thinking #gusEyeL,
  .gus-character.thinking #gusEyeR {
    animation: eyeDart 1.1s infinite ease-in-out;
  }
  .gus-character.thinking #gusBrowL {
    animation: browLiftL 1.1s infinite ease-in-out;
  }
  .gus-character.thinking #gusBrowR {
    animation: browLiftR 1.1s infinite ease-in-out;
  }

  @keyframes eyeDart {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(3px); }
  }
  @keyframes browLiftL {
    0%, 100% { d: path("M32 46 Q42 36 54 42"); }
  }
  @keyframes browLiftR {
    0%, 100% { d: path("M66 42 Q78 36 88 46"); }
  }

  /* Typing: mouth moves like talking */
  .gus-character.typing #gusMouth {
    animation: mouthTalk 0.4s infinite ease-in-out;
  }

  @keyframes mouthTalk {
    0%, 100% { d: path("M50 92 Q60 92 70 92"); }
    50% { d: path("M50 91 Q60 98 70 91"); }
  }

  .gus-character.thinking #gusMouth {
    d: path("M52 93 Q60 90 68 93");
  }
</style>
</head>
<body>

<header>
  <h1>Old Man <span>Gus</span></h1>
  <div class="mode-picker-wrap">
    <button id="modeButton" class="mode-picker" type="button">
      <span id="modeLabel">Gus — Grumpy</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div id="modeDropdown" class="mode-dropdown">
      <button class="mode-option" data-mode="gus">
        <span class="mode-name">Gus — Grumpy</span>
        <span class="mode-desc">Complains about everything. Just for laughs.</span>
      </button>
      <button class="mode-option" data-mode="serious">
        <span class="mode-name">Gus — Serious</span>
        <span class="mode-desc">Drops the act. Real answers, real help.</span>
      </button>
    </div>
  </div>
  <p>Complaints guaranteed. Ask him anything, he'll find something to grumble about.</p>
  <p id="weatherLine" class="weather-line"></p>

  <div id="controlsBar" class="controls-bar">
    <div id="grumpMeter" class="grump-meter">
      <span class="grump-label">Grump Level</span>
      <div class="grump-track">
        <button class="grump-option active" data-level="mild">Mild</button>
        <button class="grump-option" data-level="medium">Medium</button>
        <button class="grump-option" data-level="furious">Furious</button>
      </div>
    </div>
  </div>
</header>

<button id="favoritesToggle" class="favorites-toggle" type="button" title="Favorites">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 000-7.8z"/></svg>
</button>

<button id="badgesToggle" class="badges-toggle" type="button" title="Achievements">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M9 13.5L7 22l5-3 5 3-2-8.5"/></svg>
</button>

<div id="badgeToast" class="badge-toast"></div>

<div id="topBar" class="top-bar">
  <div id="patienceWrap" class="patience-wrap">
    <span class="patience-label">Gus's Patience</span>
    <div class="patience-track"><div id="patienceFill" class="patience-fill"></div></div>
  </div>

  <div class="challenge-banner">
    <button id="challengeChip" class="challenge-chip" type="button"></button>
  </div>
</div>

<div id="favoritesOverlay" class="favorites-overlay">
  <div class="favorites-panel">
    <div class="favorites-header">
      <h2>Saved Grumbles</h2>
      <button id="favoritesClose" class="favorites-close" type="button">✕</button>
    </div>
    <div id="favoritesList"></div>
  </div>
</div>

<div id="badgesOverlay" class="favorites-overlay">
  <div class="favorites-panel">
    <div class="favorites-header">
      <h2>Achievements</h2>
      <button id="badgesClose" class="favorites-close" type="button">✕</button>
    </div>
    <div id="badgesList"></div>
  </div>
</div>

<main id="chat">
  <div class="empty-state" id="empty">
    Say "hi" if you dare. Gus doesn't like being bothered, but here he is anyway.
  </div>
  <div id="chipsRow" class="chips-row">
    <button class="chip-btn" type="button">What do you think of smartphones?</button>
    <button class="chip-btn" type="button">Give me advice on life</button>
    <button class="chip-btn" type="button">What's your favorite food?</button>
    <button class="chip-btn" type="button">Tell me about the good old days</button>
    <button id="surpriseChip" class="chip-btn surprise-chip" type="button">🎲 Surprise Me</button>
  </div>
</main>

<div id="gusCharacter" class="gus-character">
  <svg viewBox="0 0 120 120" width="72" height="72">
    <circle cx="60" cy="60" r="56" fill="#E8B98A"/>
    <path id="gusBrowL" d="M32 46 Q42 36 54 42" stroke="#6b5744" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path id="gusBrowR" d="M66 42 Q78 36 88 46" stroke="#6b5744" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle id="gusEyeL" cx="44" cy="56" r="4" fill="#2B2621"/>
    <circle id="gusEyeR" cx="76" cy="56" r="4" fill="#2B2621"/>
    <rect x="30" y="49" width="26" height="16" rx="4" fill="none" stroke="#2B2621" stroke-width="3"/>
    <rect x="64" y="49" width="26" height="16" rx="4" fill="none" stroke="#2B2621" stroke-width="3"/>
    <line x1="56" y1="57" x2="64" y2="57" stroke="#2B2621" stroke-width="3"/>
    <path d="M50 78 Q60 74 70 78 Q60 84 50 78Z" fill="#D9D2C4"/>
    <path id="gusMouth" d="M50 92 Q60 92 70 92" stroke="#6b5744" stroke-width="4" fill="none" stroke-linecap="round"/>
  </svg>
  <div id="gusStatusText" class="gus-status-text">thinking...</div>
</div>

<form id="form">
  <div class="form-inner">
    <input id="input" type="text" placeholder="Say something to annoy Gus..." autocomplete="off" autocorrect="off" spellcheck="false" inputmode="text" name="gus-message-field" />
    <button type="button" id="micBtn" class="mic-btn" title="Speak instead of typing">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <button type="submit" id="send" title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
    </button>
  </div>
</form>

<script>
  const chat = document.getElementById("chat");
  const empty = document.getElementById("empty");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  const gusCharacter = document.getElementById("gusCharacter");
  const gusStatusText = document.getElementById("gusStatusText");

  function showGus(state) {
    gusCharacter.classList.add("visible");
    gusCharacter.classList.remove("thinking", "typing");
    gusCharacter.classList.add(state);
    gusStatusText.textContent = state === "thinking" ? "thinking..." : "typing...";
  }

  function hideGus() {
    gusCharacter.classList.remove("visible", "thinking", "typing");
  }

  let history = [];
  let currentMode = "gus";
  let currentGrumpLevel = "mild";

  // Mode picker dropdown behavior
  const modeWrap = document.querySelector(".mode-picker-wrap");
  const modeButton = document.getElementById("modeButton");
  const modeLabel = document.getElementById("modeLabel");
  const modeOptions = document.querySelectorAll(".mode-option");
  const controlsBar = document.getElementById("controlsBar");

  modeButton.addEventListener("click", () => {
    modeWrap.classList.toggle("open");
  });

  document.addEventListener("click", (e) => {
    if (!modeWrap.contains(e.target)) modeWrap.classList.remove("open");
  });

  const topBar = document.getElementById("topBar");

  modeOptions.forEach((opt) => {
    opt.addEventListener("click", () => {
      currentMode = opt.dataset.mode;
      modeLabel.textContent = opt.querySelector(".mode-name").textContent;
      modeOptions.forEach((o) => o.classList.remove("active"));
      opt.classList.add("active");
      modeWrap.classList.remove("open");
      history = []; // start fresh when switching modes
      chat.innerHTML = '<div class="empty-state" id="empty">Switched. Say something.</div>';
      controlsBar.style.display = currentMode === "gus" ? "flex" : "none";
      topBar.style.display = currentMode === "gus" ? "block" : "none";
    });
  });
  modeOptions[0].classList.add("active");

  // Grump-o-meter
  const grumpOptions = document.querySelectorAll(".grump-option");
  grumpOptions.forEach((opt) => {
    opt.addEventListener("click", () => {
      currentGrumpLevel = opt.dataset.level;
      grumpOptions.forEach((o) => o.classList.remove("active"));
      opt.classList.add("active");
      if (currentGrumpLevel === "furious") unlockBadge("furious_fan");
    });
  });

  // Surprise Me is now inside the quick-reply chips row (see below)

  // ---------- Feature: Patience Meter ----------
  const patienceFill = document.getElementById("patienceFill");
  let patienceLevel = 0;
  let meltdownNext = false;

  function bumpPatience() {
    patienceLevel = Math.min(100, patienceLevel + 22);
    patienceFill.style.width = patienceLevel + "%";
    if (patienceLevel >= 100) {
      meltdownNext = true;
    }
  }

  function resetPatience() {
    patienceLevel = 0;
    patienceFill.style.width = "0%";
  }

  // ---------- Feature: Quick Reply Chips ----------
  const chipsRow = document.getElementById("chipsRow");
  document.querySelectorAll(".chip-btn").forEach((chip) => {
    if (chip.id === "surpriseChip") {
      chip.addEventListener("click", () => {
        unlockBadge("curious_one");
        sendMessage("Surprise me — go on a random grumpy rant about something totally unexpected.", true);
      });
    } else {
      chip.addEventListener("click", () => {
        sendMessage(chip.textContent, false);
      });
    }
  });

  // ---------- Feature: Seasonal Accessory ----------
  function applySeasonalAccessory() {
    const today = new Date();
    const m = today.getMonth() + 1; // 1-12
    const d = today.getDate();
    const svg = document.querySelector("#gusCharacter svg");
    let accessoryHTML = "";

    if (m === 12 && d >= 20 && d <= 26) {
      // Christmas: santa hat
      accessoryHTML = `<path d="M28 40 Q60 4 92 40 L88 40 Q60 14 32 40 Z" fill="#C0392B"/><circle cx="28" cy="40" r="7" fill="#fff"/>`;
    } else if (m === 1 && d <= 2) {
      // New Year: party hat
      accessoryHTML = `<path d="M60 8 L78 42 L42 42 Z" fill="#D97757"/><circle cx="60" cy="8" r="5" fill="#F4C542"/>`;
    } else if (m === 10 && d >= 29) {
      // Halloween: witch hat
      accessoryHTML = `<path d="M60 2 L80 44 L40 44 Z" fill="#2B2621"/><ellipse cx="60" cy="44" rx="26" ry="6" fill="#2B2621"/>`;
    } else if (m === 2 && d === 14) {
      // Valentine's: small heart
      accessoryHTML = `<path d="M60 30 C56 22 44 24 44 34 C44 42 60 52 60 52 C60 52 76 42 76 34 C76 24 64 22 60 30 Z" fill="#D9536A"/>`;
    }

    if (accessoryHTML && svg) {
      svg.insertAdjacentHTML("beforeend", accessoryHTML);
    }
  }
  applySeasonalAccessory();

  // ---------- Feature: Daily Challenges ----------
  const CHALLENGES = [
    { text: "Today's challenge: Get Gus to say sorry.", starter: "I really think you should apologize to me." },
    { text: "Today's challenge: Make Gus compliment something modern.", starter: "Come on, admit ONE modern thing is actually good." },
    { text: "Today's challenge: Get Gus to admit he's not that old.", starter: "You're not even that old, be honest." },
    { text: "Today's challenge: Ask Gus for a life lesson.", starter: "Give me your best piece of life advice." },
    { text: "Today's challenge: Get Gus to recommend a movie.", starter: "What movie should I watch tonight?" },
    { text: "Today's challenge: Make Gus laugh (good luck).", starter: "Tell me a joke, Gus." },
    { text: "Today's challenge: Get Gus to admit he likes something you say.", starter: "I bet you secretly like talking to me." },
  ];
  const challengeChip = document.getElementById("challengeChip");
  const dayIndex = new Date().getDate() % CHALLENGES.length;
  const todayChallenge = CHALLENGES[dayIndex];
  challengeChip.textContent = todayChallenge.text;
  challengeChip.addEventListener("click", () => {
    input.value = todayChallenge.starter;
    input.focus();
  });

  // ---------- Feature: Daily Weather Line ----------
  const WEATHER_LINES = [
    "Today's forecast: 90% chance of complaining.",
    "Overcast with scattered sighs.",
    "Heavy grumbling expected after 3pm.",
    "Mild irritation, clearing to full outrage by evening.",
    "Storm warning: modern technology mentioned.",
    "Sunny, but Gus refuses to enjoy it.",
    "Foggy memory, clear opinions.",
  ];
  document.getElementById("weatherLine").textContent =
    WEATHER_LINES[new Date().getDate() % WEATHER_LINES.length];

  // ---------- Feature: Running Joke (per session quirk) ----------
  const QUIRKS = [
    "pigeons",
    "the mailman being late",
    "his noisy neighbor's leaf blower",
    "the price of milk these days",
    "his creaky knees",
    "expired coupons he refuses to throw away",
    "squirrels stealing from his bird feeder",
    "his old radio that only gets static",
    "subscription services charging him for things he forgot about",
    "the neighbor's cat using his lawn as a bathroom",
  ];
  const sessionQuirk = QUIRKS[Math.floor(Math.random() * QUIRKS.length)];

  // ---------- Feature: Achievement Badges ----------
  const BADGES = [
    { id: "first_words", name: "First Words", desc: "Sent your first message to Gus." },
    { id: "chatterbox", name: "Chatterbox", desc: "Sent 10 messages in one session." },
    { id: "snapped_him", name: "Snapped Him", desc: "Pushed Gus to his patience limit." },
    { id: "curious_one", name: "Curious One", desc: "Used the Surprise Me button." },
    { id: "collector", name: "Collector", desc: "Saved a reply to your favorites." },
    { id: "furious_fan", name: "Furious Fan", desc: "Cranked Gus up to Furious." },
  ];

  function getUnlockedBadges() {
    try {
      return JSON.parse(localStorage.getItem("gusBadges") || "[]");
    } catch (e) {
      return [];
    }
  }

  function unlockBadge(id) {
    const unlocked = getUnlockedBadges();
    if (unlocked.includes(id)) return;
    unlocked.push(id);
    localStorage.setItem("gusBadges", JSON.stringify(unlocked));
    const badge = BADGES.find((b) => b.id === id);
    if (badge) showBadgeToast(badge.name);
  }

  function showBadgeToast(name) {
    const toast = document.getElementById("badgeToast");
    toast.textContent = "🏅 Achievement unlocked: " + name;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2800);
  }

  function renderBadges() {
    const unlocked = getUnlockedBadges();
    const list = document.getElementById("badgesList");
    list.innerHTML = "";
    BADGES.forEach((b) => {
      const isUnlocked = unlocked.includes(b.id);
      const item = document.createElement("div");
      item.className = "badge-item" + (isUnlocked ? "" : " locked");
      item.innerHTML = `<div class="badge-icon">${isUnlocked ? "✓" : "?"}</div><div class="badge-text"><strong>${b.name}</strong><span>${b.desc}</span></div>`;
      list.appendChild(item);
    });
  }

  const badgesToggle = document.getElementById("badgesToggle");
  const badgesOverlay = document.getElementById("badgesOverlay");
  const badgesClose = document.getElementById("badgesClose");
  badgesToggle.addEventListener("click", () => {
    renderBadges();
    badgesOverlay.classList.add("open");
  });
  badgesClose.addEventListener("click", () => badgesOverlay.classList.remove("open"));
  badgesOverlay.addEventListener("click", (e) => {
    if (e.target === badgesOverlay) badgesOverlay.classList.remove("open");
  });

  let userMessageCount = 0;

  // ---------- Feature: Instant Reaction (client-side, no API call) ----------
  const REACTION_KEYWORDS = {
    phone: "🙄", smartphone: "🙄", app: "🙄", "social media": "🙄",
    tiktok: "🙄", instagram: "🙄", ai: "🤨", wifi: "😤", internet: "😤",
    love: "😳", kiss: "😳",
  };

  function getInstantReaction(text) {
    const lower = text.toLowerCase();
    for (const kw in REACTION_KEYWORDS) {
      if (lower.includes(kw)) return REACTION_KEYWORDS[kw];
    }
    return null;
  }

  // ---------- Feature: Voice Input (speech-to-text) below handles mic input ----------

  // ---------- Feature: Voice Input (speech-to-text) ----------
  const micBtn = document.getElementById("micBtn");
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognitionAPI) {
    micBtn.style.display = "none";
  } else {
    const recognition = new SpeechRecognitionAPI();
    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    let isRecording = false;

    micBtn.addEventListener("click", () => {
      if (isRecording) {
        recognition.stop();
        return;
      }
      try {
        recognition.start();
        isRecording = true;
        micBtn.classList.add("recording");
      } catch (e) { /* already started, ignore */ }
    });

    recognition.addEventListener("result", (e) => {
      const transcript = e.results[0][0].transcript;
      input.value = transcript;
      input.focus();
    });

    recognition.addEventListener("end", () => {
      isRecording = false;
      micBtn.classList.remove("recording");
    });

    recognition.addEventListener("error", () => {
      isRecording = false;
      micBtn.classList.remove("recording");
    });
  }

  const favoritesToggle = document.getElementById("favoritesToggle");
  const favoritesOverlay = document.getElementById("favoritesOverlay");
  const favoritesClose = document.getElementById("favoritesClose");
  const favoritesList = document.getElementById("favoritesList");

  function getFavorites() {
    try {
      return JSON.parse(localStorage.getItem("gusFavorites") || "[]");
    } catch (e) {
      return [];
    }
  }

  function saveFavorites(list) {
    localStorage.setItem("gusFavorites", JSON.stringify(list));
  }

  function isFavorited(text) {
    return getFavorites().includes(text);
  }

  function toggleFavorite(text, btn) {
    let favs = getFavorites();
    if (favs.includes(text)) {
      favs = favs.filter((f) => f !== text);
      btn.classList.remove("active");
    } else {
      favs.push(text);
      btn.classList.add("active");
    }
    saveFavorites(favs);
  }

  function renderFavorites() {
    const favs = getFavorites();
    if (favs.length === 0) {
      favoritesList.innerHTML = `<div class="favorites-empty">No saved grumbles yet. Tap the heart on any reply to save it here.</div>`;
      return;
    }
    favoritesList.innerHTML = "";
    favs.forEach((text) => {
      const item = document.createElement("div");
      item.className = "favorite-item";
      item.innerHTML = `<span>${text}</span><button class="favorite-remove" type="button">Remove</button>`;
      item.querySelector(".favorite-remove").addEventListener("click", () => {
        saveFavorites(getFavorites().filter((f) => f !== text));
        renderFavorites();
      });
      favoritesList.appendChild(item);
    });
  }

  favoritesToggle.addEventListener("click", () => {
    renderFavorites();
    favoritesOverlay.classList.add("open");
  });
  favoritesClose.addEventListener("click", () => favoritesOverlay.classList.remove("open"));
  favoritesOverlay.addEventListener("click", (e) => {
    if (e.target === favoritesOverlay) favoritesOverlay.classList.remove("open");
  });

  const SITE_URL = "https://oldmangus.vercel.app"; // update if your domain changes

  function generateShareImage(text) {
    const canvas = document.createElement("canvas");
    canvas.width = 800;
    canvas.height = 500;
    const ctx = canvas.getContext("2d");

    // Background
    ctx.fillStyle = "#F4F1EA";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#D97757";
    ctx.lineWidth = 10;
    ctx.strokeRect(0, 0, canvas.width, canvas.height);

    // Header label
    ctx.fillStyle = "#B85C3E";
    ctx.font = "bold 28px Georgia";
    ctx.fillText("Old Man Gus says:", 50, 80);

    // Message text, word-wrapped
    ctx.fillStyle = "#2B2621";
    ctx.font = "34px Georgia";
    const words = text.split(" ");
    let line = "";
    let y = 160;
    const maxWidth = 700;
    const lineHeight = 46;
    for (const word of words) {
      const testLine = line + word + " ";
      if (ctx.measureText(testLine).width > maxWidth && line !== "") {
        ctx.fillText(line, 50, y);
        line = word + " ";
        y += lineHeight;
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line, 50, y);

    // Footer
    ctx.fillStyle = "#5B5346";
    ctx.font = "20px -apple-system, sans-serif";
    ctx.fillText(SITE_URL.replace("https://", ""), 50, canvas.height - 40);

    return canvas;
  }

  async function shareAsImage(text, btn) {
    const canvas = generateShareImage(text);
    canvas.toBlob(async (blob) => {
      const file = new File([blob], "old-man-gus.png", { type: "image/png" });
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: "Old Man Gus" });
          return;
        } catch (e) { /* user cancelled or unsupported, fall through to download */ }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "old-man-gus.png";
      a.click();
      URL.revokeObjectURL(url);
    }, "image/png");
  }

  function shareToWhatsApp(text) {
    const message = `"${text}" — Old Man Gus\n${SITE_URL}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, "_blank");
  }

  function shareToTwitter(text) {
    const message = `"${text}" — Old Man Gus\n${SITE_URL}`;
    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(message)}`, "_blank");
  }

  function buildActionsRow(text) {
    const row = document.createElement("div");
    row.className = "msg-actions";

    const favBtn = document.createElement("button");
    favBtn.type = "button";
    favBtn.className = "action-btn fav-btn" + (isFavorited(text) ? " active" : "");
    favBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 000-7.8z"/></svg>`;
    favBtn.addEventListener("click", () => {
      toggleFavorite(text, favBtn);
      if (isFavorited(text)) unlockBadge("collector");
    });
    row.appendChild(favBtn);

    // Sharing (image / WhatsApp / X) is only offered in Gus's grumpy mode —
    // serious-mode answers are meant to be used, not memed.
    if (currentMode !== "gus") return row;

    const imgBtn = document.createElement("button");
    imgBtn.type = "button";
    imgBtn.className = "action-btn";
    imgBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 15l-5-5L5 19"/></svg> Image`;
    imgBtn.addEventListener("click", () => shareAsImage(text));
    row.appendChild(imgBtn);

    const waBtn = document.createElement("button");
    waBtn.type = "button";
    waBtn.className = "action-btn";
    waBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg> WhatsApp`;
    waBtn.addEventListener("click", () => shareToWhatsApp(text));
    row.appendChild(waBtn);

    const xBtn = document.createElement("button");
    xBtn.type = "button";
    xBtn.className = "action-btn";
    xBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h4l-8.5 9.5L23 22h-6.8l-5.3-6.9L4.8 22H1l9.1-10.2L1 2h7l4.8 6.3z"/></svg> X`;
    xBtn.addEventListener("click", () => shareToTwitter(text));
    row.appendChild(xBtn);

    return row;
  }

  function addMessage(role, text) {
    if (empty) empty.remove();
    if (chipsRow) chipsRow.remove();
    const wrap = document.createElement("div");
    wrap.className = "msg-wrap " + (role === "user" ? "user" : "bot");

    const rowWrap = document.createElement("div");
    rowWrap.className = "msg " + (role === "user" ? "user" : "bot");
    rowWrap.innerHTML = `<div class="bubble">${text}</div>`;
    wrap.appendChild(rowWrap);

    if (role === "user") {
      const reaction = getInstantReaction(text);
      if (reaction) {
        const badge = document.createElement("div");
        badge.className = "reaction-badge";
        badge.textContent = reaction;
        wrap.appendChild(badge);
      }
    }

    if (role !== "user") {
      wrap.appendChild(buildActionsRow(text));
    }

    chat.appendChild(wrap);
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    return rowWrap.querySelector(".bubble");
  }

  function addTyping() {
    if (empty) empty.remove();
    const wrap = document.createElement("div");
    wrap.className = "msg bot";
    wrap.id = "typing-indicator";
    wrap.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chat.appendChild(wrap);
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }

  function removeTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    sendMessage(text, false);
  });

  async function sendMessage(text, hideUserBubble) {
    if (!hideUserBubble) {
      addMessage("user", text);
    } else {
      if (empty) empty.remove();
      const tag = document.createElement("div");
      tag.className = "empty-state";
      tag.style.margin = "0 0 4px";
      tag.textContent = "🎲 Surprise round";
      chat.appendChild(tag);
    }
    history.push({ role: "user", content: text });
    if (!hideUserBubble) {
      userMessageCount++;
      if (userMessageCount === 1) unlockBadge("first_words");
      if (userMessageCount === 10) unlockBadge("chatterbox");
    }
    sendBtn.disabled = true;
    addTyping();
    showGus("thinking");
    bumpPatience();
    const isMeltdown = meltdownNext;
    meltdownNext = false;
    if (isMeltdown) unlockBadge("snapped_him");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history, mode: currentMode, intensity: currentGrumpLevel, meltdown: isMeltdown, quirk: sessionQuirk }),
      });
      const data = await res.json();
      removeTyping();
      showGus("typing");

      if (!res.ok) {
        addMessage("bot", "Ugh, something broke. Typical.");
      } else {
        addMessage("bot", data.reply);
        history.push({ role: "assistant", content: data.reply });
      }

      if (isMeltdown) resetPatience();
      setTimeout(hideGus, 900);
    } catch (err) {
      removeTyping();
      hideGus();
      addMessage("bot", "Can't even connect right. Newfangled internet.");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }
</script>

</body>
</html>
